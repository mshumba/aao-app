name: Paths
# Every path and series file's rules (docs/development/paths.md). The library checks
# (quotes, lengths, preacher) need the read-only login, so authors run them locally
# through `node scripts/paths.mjs ready` before merging.
on:
  push:
    paths: ["content/paths/**", "scripts/paths.mjs", "supabase/seed/needs.sql", ".github/workflows/paths.yml"]
  pull_request:
    paths: ["content/paths/**", "scripts/paths.mjs", "supabase/seed/needs.sql", ".github/workflows/paths.yml"]
permissions:
  contents: read
concurrency:
  group: paths-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/paths.mjs check --offline
